name: Release

# Push a tag like v1.2.0 and this builds every package and publishes a GitHub
# Release with them attached:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match the VERSION in CMakeLists.txt (checked below).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run: builds the packages and uploads them as a workflow artifact only

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version from CMakeLists.txt
        id: ver
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Project version: $version"

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt VERSION ${{ steps.ver.outputs.version }}. Bump VERSION first."
            exit 1
          fi

      # Compiles in containers (AlmaLinux 8 for Linux, MinGW for Windows) and
      # runs the unit tests there before packaging.
      - name: Build all packages
        run: ./scripts/build-all.sh

      - name: Upload packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HillRush-${{ steps.ver.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Hill Rush ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            dist/*.AppImage dist/*.deb dist/*.tar.gz dist/*.zip dist/SHA256SUMS
